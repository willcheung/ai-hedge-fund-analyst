name: Offline staging verification
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: /tmp/analyst-ci
jobs:
  source-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare disposable root-owned source copy
        working-directory: ${{ github.workspace }}
        run: |
          sudo mkdir /tmp/analyst-ci
          sudo cp -a . /tmp/analyst-ci/
          sudo chown -R root:root /tmp/analyst-ci
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gitleaks bubblewrap
      - name: Scan committed history
        run: sudo env -i PATH=/usr/bin:/bin gitleaks detect --source . --redact --exit-code 1
      - name: Verify source and isolation behavior
        run: |
          sudo env -i PATH=/usr/bin:/bin python3 -m unittest discover -s tools/preflight -p 'test_*.py' -v
          sudo env -i PATH=/usr/bin:/bin python3 -m unittest discover -s tools/staging -p 'test_*.py' -v
          sudo env -i PATH=/usr/bin:/bin python3 tools/staging/check_source.py
      - name: Offline synthetic job definitions and scratch round-trip
        run: |
          sudo env -i PATH=/usr/bin:/bin STAGING_ROOT=/tmp/analyst-ci bash tools/staging/offline.sh bash -c 'python3 -m unittest discover -s deploy/jobs -p "test_*.py" -v && python3 deploy/jobs/manage.py validate deploy/jobs/definitions.json && python3 deploy/jobs/manage.py scratch-import deploy/jobs/definitions.json --destination /tmp/analyst-job-scratch-ci-check'
  dashboard-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare disposable root-owned source copy
        working-directory: ${{ github.workspace }}
        run: |
          sudo mkdir /tmp/analyst-ci
          sudo cp -a . /tmp/analyst-ci/
          sudo chown -R root:root /tmp/analyst-ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Acquire wheels, then install offline
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
          sudo env -i PATH="$PATH" HOME=/tmp/analyst-ci/install-home python -m venv .venv
          sudo env -i PATH="$PATH" HOME=/tmp/analyst-ci/install-home python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r dashboard/requirements.txt -d .wheelhouse
          sudo env -i PATH="/tmp/analyst-ci/.venv/bin:$PATH" STAGING_ROOT=/tmp/analyst-ci bash tools/staging/offline.sh python -m pip install --no-index --find-links .wheelhouse --require-hashes -r dashboard/requirements.txt
      - name: Offline Python tests
        working-directory: /tmp/analyst-ci/dashboard
        run: sudo env -i PATH="/tmp/analyst-ci/.venv/bin:$PATH" STAGING_ROOT=/tmp/analyst-ci bash ../tools/staging/offline.sh bash -c 'python scripts/validate_demo_privacy.py --source-only && python scripts/validate_section_contract.py && python -m unittest discover -s tests -v'
  dashboard-js-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare disposable root-owned source copy
        working-directory: ${{ github.workspace }}
        run: |
          sudo mkdir /tmp/analyst-ci
          sudo cp -a . /tmp/analyst-ci/
          sudo chown -R root:root /tmp/analyst-ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Acquire locked dependencies and install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
          sudo env -i PATH="$PATH" HOME=/tmp/analyst-ci/install-home python -m venv .venv
          sudo env -i PATH="$PATH" HOME=/tmp/analyst-ci/install-home python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r dashboard/requirements.txt -d .wheelhouse
          sudo env -i PATH="/tmp/analyst-ci/.venv/bin:$PATH" STAGING_ROOT=/tmp/analyst-ci bash tools/staging/offline.sh python -m pip install --no-index --find-links .wheelhouse --require-hashes -r dashboard/requirements.txt
          sudo env -i PATH="$PATH" HOME=/tmp/analyst-ci/install-home npm ci --ignore-scripts --prefix dashboard
      - name: Offline JavaScript tests and synthetic build
        working-directory: /tmp/analyst-ci/dashboard
        run: sudo env -i PATH="/tmp/analyst-ci/.venv/bin:$PATH" STAGING_ROOT=/tmp/analyst-ci bash ../tools/staging/offline.sh bash -c 'npm test && npm run build && npm run validate:public && npm run validate:privacy'
      - name: Hand off the validated synthetic artifact
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/analyst-ci/dashboard/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-staging-dashboard-${{ github.sha }}
          path: /tmp/analyst-ci/dashboard/dist/
          if-no-files-found: error
          retention-days: 14
  automation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare disposable root-owned source copy
        working-directory: ${{ github.workspace }}
        run: |
          sudo mkdir /tmp/analyst-ci
          sudo cp -a . /tmp/analyst-ci/
          sudo chown -R root:root /tmp/analyst-ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Acquire wheels, then install offline
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap fonts-dejavu-core
          sudo env -i PATH="$PATH" HOME=/tmp/analyst-ci/install-home python -m venv .venv
          sudo env -i PATH="$PATH" HOME=/tmp/analyst-ci/install-home python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r automation/requirements-test.txt -d .wheelhouse
          sudo env -i PATH="/tmp/analyst-ci/.venv/bin:$PATH" STAGING_ROOT=/tmp/analyst-ci bash tools/staging/offline.sh python -m pip install --no-index --find-links .wheelhouse --require-hashes -r automation/requirements-test.txt
      - name: Offline automation tests
        working-directory: /tmp/analyst-ci/automation
        run: sudo env -i PATH="/tmp/analyst-ci/.venv/bin:$PATH" STAGING_ROOT=/tmp/analyst-ci bash ../tools/staging/offline.sh python -m unittest discover -p 'test_*.py' -v
  disabled-execution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare disposable root-owned source copy
        working-directory: ${{ github.workspace }}
        run: |
          sudo mkdir /tmp/analyst-ci
          sudo cp -a . /tmp/analyst-ci/
          sudo chown -R root:root /tmp/analyst-ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Acquire wheels, then install offline
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
          sudo env -i PATH="$PATH" HOME=/tmp/analyst-ci/install-home python -m venv .venv
          sudo env -i PATH="$PATH" HOME=/tmp/analyst-ci/install-home python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r trading-execution/requirements-test.txt -d .wheelhouse
          sudo env -i PATH="/tmp/analyst-ci/.venv/bin:$PATH" STAGING_ROOT=/tmp/analyst-ci bash tools/staging/offline.sh python -m pip install --no-index --find-links .wheelhouse --require-hashes -r trading-execution/requirements-test.txt
      - name: Offline package install and disabled-execution tests
        working-directory: /tmp/analyst-ci/trading-execution
        run: sudo env -i PATH="/tmp/analyst-ci/.venv/bin:$PATH" STAGING_ROOT=/tmp/analyst-ci bash ../tools/staging/offline.sh bash -c 'python -m pip install --no-index --no-deps --no-build-isolation . && python -m pip check && python -m pytest -q'
