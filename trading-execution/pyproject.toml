[build-system]
requires = ["setuptools>=83.0.0,<84", "wheel>=0.45,<0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-execution"
version = "0.2.0"
description = "Disabled-by-default IBKR execution component with deterministic risk gates."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.1,<7", "jsonschema>=4.22,<5", "ib-insync>=0.9.86,<0.10"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trading_execution = ["resources/*.json", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
